# /etc/modprobe.d/snd-aloop.conf
# Fixed card id "Loopback"; clock the loopback from the S/PDIF HAT so capture and
# playback share one clock (no drift). Replace sndrpihifiberry with the HAT's id
# from `cat /proc/asound/cards`. Needs kernel >= 5.8.
options snd-aloop id=Loopback pcm_substreams=1 timer_source=sndrpihifiberry
