# Example for /etc/mopidy/mopidy.conf: Mopidy plays into the loopback instead of the HAT.
# Keep your own chain (converters, resampler, caps) and change only the sink, as
# `streamjanitor mopidy-output --original "<your current output>"` prints it:
#   device       the loopback; plughw: accepts whatever format the chain produces
#   buffer-time  ALSA buffer in microseconds (alsa_latency_ms in streamjanitor's config)
#   latency-time ALSA period in microseconds: must equal streamjanitor's period
#                (alsa_latency_ms / 4 = 25 ms), because a loopback clocked by the HAT
#                (snd-aloop timer_source) only accepts the HAT's period
# The rate in the caps must equal sample_rate in streamjanitor's config.
[audio]
output = audioconvert ! audioresample ! audio/x-raw,rate=96000,channels=2,format=S24LE ! alsasink device=plughw:Loopback,0 buffer-time=100000 latency-time=25000
