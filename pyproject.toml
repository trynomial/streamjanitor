[project]
name = "streamjanitor"
version = "0.2.0"
description = "Detect known clips in a live radio stream and splice in replacements (Raspberry Pi / ALSA)"
readme = "README.md"
authors = [
    { name = "LEA", email = "trynomial@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
streamjanitor = "streamjanitor.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
